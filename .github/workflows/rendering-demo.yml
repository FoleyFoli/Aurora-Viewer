name: Compare the single-loop PCSS filter on ordinary Metal
on:
  push:
    branches: [validation/metal-pcss-single-loop-57d978f7]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: github.repository == 'FoleyFoli/Aurora-Viewer'
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [pcss-single-loop]
    env:
      BUILD_RUN: '45129232727'
      BEFORE: 86b9cdacc3060b052159fa20e368ff4369b0c492
      AFTER: 57d978f7a97d89c358fb40c838201d1c226ff84d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            .github/qa
            crates/aurora-render/src/shaders
          persist-credentials: false
      - name: Apply and verify the exact candidate shader override
        shell: bash
        run: |
          shader=crates/aurora-render/src/shaders/common.wgsl
          printf '%s  %s\n' 33a3070f6e044399697172750afb19625dcfe0637cb301fcabc09c22d7517667 "$shader" | shasum -a 256 -c
          git apply --check .github/qa/pcss-single-loop.patch
          git apply .github/qa/pcss-single-loop.patch
          printf '%s  %s\n' 2776eef6cc3974c52c7347c4e1a15f4eed8ce93619ac68969eb7fcf5c5c40405 "$shader" | shasum -a 256 -c
      - name: Verify the archived builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir diagnostics
          sw_vers > diagnostics/runner.txt
          printf 'ImageOS=%s ImageVersion=%s RUNNER_ARCH=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" >> diagnostics/runner.txt
          metadata="repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN"
          gh api "$metadata" --jq '.head_sha' | grep -Fxq f8962fd5a2d10ac812f3e46c5fc091248dcf2fe9
          gh api "$metadata/artifacts" > "$RUNNER_TEMP/artifacts.json"
          while read -r id side ref digest; do
            jq -e --argjson id "$id" --arg name "rendering-macos-$side-$ref" --arg digest "sha256:$digest" \
              '.artifacts[] | select(.id == $id and .name == $name and .digest == $digest and .expired == false)' \
              "$RUNNER_TEMP/artifacts.json" > /dev/null
            printf '%s %s %s %s\n' "$side" "$ref" "$id" "$digest" >> diagnostics/builds.txt
          done <<BUILDS
          14798136385 before $BEFORE 7548a85957516b9c4f512b3d942c336a80b628a23974371ea36a7929a77ec871
          14797668045 after $AFTER 82c0c2c76b1922efc6c5c5a988a2b30d473eb353dbdf1062b19fa741f47d67b3
          BUILDS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 14798136385,14797668045
          run-id: 45129232727
          github-token: ${{ github.token }}
          path: archives
          merge-multiple: true
      - name: Check executable manifests and prepare window inspection
        shell: bash
        run: |
          for side in before after; do
            dir="$RUNNER_TEMP/viewer-$side"
            mkdir -p "$dir"
            tar -xzf "archives/viewer-$side.tar.gz" -C "$dir" aurora-viewer revision.txt viewer.sha256
            expected="$AFTER"
            if [[ $side == before ]]; then expected="$BEFORE"; fi
            test "$(cat "$dir/revision.txt")" = "$expected"
            (cd "$dir" && shasum -a 256 -c viewer.sha256 && test -x aurora-viewer)
          done
          swiftc .github/qa/metal-window.swift -o "$RUNNER_TEMP/metal-window"
      - name: Compare candidate and upstream in one diagnostic mode
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: caffeinate -dimsu python3 .github/qa/metal-native.py "$RUNNER_TEMP" diagnostics "$MODE"
      - name: Collect native Metal system messages
        if: always() && !cancelled()
        shell: bash
        run: /usr/bin/log show --last 25m --style compact --predicate 'process == "aurora-viewer"' --info > diagnostics/native-system.log 2>&1 || true
      - name: Assess both world captures and native logs
        if: always() && !cancelled()
        env:
          MODE: ${{ matrix.mode }}
        run: python3 .github/qa/assess-metal.py diagnostics "$MODE"
      - name: Upload raw evidence and measurements
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Aurora-Viewer-57d978f7-native-${{ matrix.mode }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

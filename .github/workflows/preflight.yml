name: Rendering quality Windows preflight
on:
  push:
    branches: [validation/rendering-quality-57d978f7]
permissions:
  contents: read
jobs:
  full-check:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out the rendering quality candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 57d978f7a97d89c358fb40c838201d1c226ff84d
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity
        shell: python
        run: |
          import subprocess
          for ref, expected in [('HEAD', '57d978f7a97d89c358fb40c838201d1c226ff84d'), ('HEAD^{tree}', 'f87c9698d03ac42c574d868ec2f610b7d8d9b5fe')]:
              actual = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
              print(f'{ref}: {actual}', flush=True)
              if actual != expected:
                  raise SystemExit(f'Expected {expected}; got {actual}')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', 'scripts'], check=True)
      - name: Run the repository check in Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File .\scripts\check.ps1

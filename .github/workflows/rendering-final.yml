name: Verify integrated rendering candidate

on:
  push:
    branches: [validation/shadow-metal-final]

permissions:
  contents: read

env:
  SOURCE_COMMIT: 1ece5d490629a9371f6f8547d771d9f82de9f1d9
  SOURCE_TREE: 897099aa77d6c29284a0c44e8093701d9324abd9
  APPROVED_COMMIT: 57d978f7a97d89c358fb40c838201d1c226ff84d
  CARGO_TERM_COLOR: always

jobs:
  windows:
    if: github.repository == 'FoleyFoli/Aurora-Viewer'
    name: Stock Windows checks on the exact source
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify the source commit, tree and approved ancestor
        shell: bash
        run: |
          [[ $SOURCE_COMMIT =~ ^[0-9a-f]{40}$ && $SOURCE_TREE =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git merge-base --is-ancestor "$APPROVED_COMMIT" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p ../evidence/windows
          git show -s --format='commit=%H%ntree=%T%nparents=%P%nsubject=%s' HEAD > ../evidence/windows/source.txt
          printf 'workflow=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> ../evidence/windows/source.txt
      - name: Run the unchanged repository check script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path ../evidence/windows/check-transcript.txt
          try {
              & ./scripts/check.ps1
              if ($LASTEXITCODE -ne 0) { throw "scripts/check.ps1 failed: $LASTEXITCODE" }
              if ((git status --porcelain --untracked-files=no)) { throw 'Checks modified tracked source files' }
              rustc --version
              cargo --version
          } finally {
              Stop-Transcript
          }
      - name: Build the portable development client after stock checks
        shell: pwsh
        timeout-minutes: 90
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked -p aurora-viewer 2>&1 | Tee-Object -FilePath ../evidence/windows/dev-build.log
          if ($LASTEXITCODE -ne 0) { throw "Development client build failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath target/debug/aurora-viewer.exe -PathType Leaf)) {
              throw 'The default dev build did not produce target/debug/aurora-viewer.exe'
          }
          if ((git status --porcelain --untracked-files=all)) { throw 'Build modified tracked source files' }
      - name: Stage and verify the portable development client
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:SOURCE_TREE -notmatch '^[0-9a-f]{40}$') {
              throw 'Invalid expected source identity'
          }
          $actualCommit = (git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualCommit -ne $env:SOURCE_COMMIT) { throw 'Source commit changed before packaging' }
          $actualTree = (git rev-parse 'HEAD^{tree}' | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualTree -ne $env:SOURCE_TREE) { throw 'Source tree changed before packaging' }
          git merge-base --is-ancestor $env:APPROVED_COMMIT HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Approved source is not an ancestor of the packaged build' }
          if ((git status --porcelain --untracked-files=all)) { throw 'Source checkout is dirty before packaging' }

          $sourceRoot = (Get-Location).Path
          $exe = (Resolve-Path -LiteralPath target/debug/aurora-viewer.exe).Path
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageName = "Aurora-Viewer-rendering-test-$env:SOURCE_COMMIT"
          $stage = Join-Path $env:RUNNER_TEMP $packageName
          if (Test-Path -LiteralPath $stage) { throw 'Package staging folder already exists' }
          # Reuse the repository's executable, assets, licenses and install metadata.
          & ./scripts/package.ps1 -Exe $exe -Out $stage -Source $sourceRoot
          if ($LASTEXITCODE -ne 0) { throw "Repository packaging failed: $LASTEXITCODE" }
          $dlls = @(Get-ChildItem -LiteralPath (Split-Path $exe -Parent) -Filter '*.dll' -File)
          foreach ($dll in $dlls) { Copy-Item -LiteralPath $dll.FullName -Destination $stage }
          foreach ($notice in @('THIRD-PARTY-LICENSES.md', 'TRADEMARKS.md')) {
              Copy-Item -LiteralPath (Join-Path $sourceRoot $notice) -Destination $stage
          }
          $stagedExe = Join-Path $stage 'aurora-viewer.exe'
          if ((Get-FileHash -LiteralPath $stagedExe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeHash) {
              throw 'Packaged executable differs from the freshly built development client'
          }
          foreach ($dll in $dlls) {
              if ((Get-FileHash -LiteralPath (Join-Path $stage $dll.Name) -Algorithm SHA256).Hash -ne
                  (Get-FileHash -LiteralPath $dll.FullName -Algorithm SHA256).Hash) {
                  throw "Packaged DLL differs from build output: $($dll.Name)"
              }
          }
          foreach ($required in @('LICENSE', 'NOTICE.md', 'THIRD-PARTY-LICENSES.md', 'aurora-install.json')) {
              if (-not (Test-Path -LiteralPath (Join-Path $stage $required) -PathType Leaf)) {
                  throw "Package is missing $required"
              }
          }
          $manifest = [ordered]@{
              schema = 1
              kind = 'modified rendering development test client'
              source_repository = $env:GITHUB_REPOSITORY
              source_commit = $actualCommit
              source_tree = $actualTree
              source_url = "https://github.com/$env:GITHUB_REPOSITORY/tree/$actualCommit"
              approved_ancestor = $env:APPROVED_COMMIT
              workflow_commit = $env:GITHUB_SHA
              workflow_run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              build_command = 'cargo build --locked -p aurora-viewer'
              build_profile = 'dev'
              executable = [ordered]@{ path = 'aurora-viewer.exe'; sha256 = $exeHash; bytes = (Get-Item -LiteralPath $exe).Length }
              adjacent_dlls = @($dlls | Sort-Object Name | ForEach-Object {
                  [ordered]@{ path = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
              })
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $stage 'build-manifest.json') -Encoding utf8NoBOM
          @(
              'Aurora Viewer rendering development test client (modified build).'
              'Extract the complete folder, then run aurora-viewer.exe.'
              "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$actualCommit"
              'This is the default dev build for review, not an official release.'
              'build-manifest.json records the exact source and executable SHA-256.'
          ) | Set-Content -LiteralPath (Join-Path $stage 'TEST-CLIENT.txt') -Encoding utf8NoBOM
          $payloadFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File | Sort-Object FullName)
          $checksums = @($payloadFiles | ForEach-Object {
              $relative = $_.FullName.Substring($stage.Length + 1).Replace('\', '/')
              "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $relative
          })
          $checksums | Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Encoding utf8NoBOM

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'test-client'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $zipPath = Join-Path $artifactDir "$packageName.zip"
          Compress-Archive -LiteralPath $stage -DestinationPath $zipPath -CompressionLevel Optimal
          $stagedFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File)
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
              $archivedFiles = @($archive.Entries | Where-Object { $_.Name -ne '' })
              if ($archivedFiles.Count -ne $stagedFiles.Count) { throw 'Zip file count differs from the staged package' }
              foreach ($file in $stagedFiles) {
                  $relative = $file.FullName.Substring($stage.Length + 1).Replace('\', '/')
                  $entry = $archive.GetEntry("$packageName/$relative")
                  if ($null -eq $entry) { throw "Zip is missing $relative" }
                  $stream = $entry.Open()
                  $digest = [Security.Cryptography.SHA256]::Create()
                  try {
                      $entryHash = [BitConverter]::ToString($digest.ComputeHash($stream)).Replace('-', '').ToLowerInvariant()
                  } finally {
                      $digest.Dispose()
                      $stream.Dispose()
                  }
                  if ($entryHash -ne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) {
                      throw "Zip checksum differs from the staged file: $relative"
                  }
              }
          } finally {
              $archive.Dispose()
          }
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $packageName.zip" | Set-Content -LiteralPath "$zipPath.sha256" -Encoding utf8NoBOM
          Copy-Item -LiteralPath (Join-Path $stage 'build-manifest.json') -Destination ../evidence/windows/test-client-manifest.json
          Copy-Item -LiteralPath "$zipPath.sha256" -Destination ../evidence/windows/test-client.zip.sha256
          if ((git status --porcelain --untracked-files=all)) { throw 'Packaging modified tracked source files' }
          Write-Host "Verified $packageName.zip ($($stagedFiles.Count) files), SHA-256 $zipHash"
      - name: Upload the portable development test client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aurora-Viewer-rendering-test-${{ env.SOURCE_COMMIT }}
          path: |
            test-client/*.zip
            test-client/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload the Windows check evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendering-final-windows-${{ env.SOURCE_COMMIT }}
          path: evidence/windows/
          if-no-files-found: error
          retention-days: 14

  metal:
    if: github.repository == 'FoleyFoli/Aurora-Viewer'
    name: Ordinary Metal captures (${{ matrix.side }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: upstream
            commit: '63cca6e0611425a11e6d8421f589fb367ac27d03'
            tree: '8287f97e3faf6536e77da3a5aa31ce6972b827cd'
          - side: candidate
            commit: '1ece5d490629a9371f6f8547d771d9f82de9f1d9'
            tree: '897099aa77d6c29284a0c44e8093701d9324abd9'
    env:
      SOURCE_COMMIT: ${{ matrix.commit }}
      SOURCE_TREE: ${{ matrix.tree }}
      SIDE: ${{ matrix.side }}
      BASELINE_COMMIT: '63cca6e0611425a11e6d8421f589fb367ac27d03'
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - name: Check out the verification helper separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: validation
          sparse-checkout: .github/qa
          persist-credentials: false
      - name: Check out the exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity and comparison ancestry
        run: |
          [[ $SOURCE_COMMIT =~ ^[0-9a-f]{40}$ && $SOURCE_TREE =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          if [[ "$SIDE" == candidate ]]; then
            git merge-base --is-ancestor "$APPROVED_COMMIT" HEAD
            git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD
          else
            test "$SOURCE_COMMIT" = "$BASELINE_COMMIT"
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p ../evidence/metal
          git show -s --format='commit=%H%ntree=%T%nparents=%P%nsubject=%s' HEAD > ../evidence/metal/source.txt
          printf 'workflow=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> ../evidence/metal/source.txt
      - name: Build the exact source with the repository CI profile
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo build --profile ci --locked -p aurora-viewer 2>&1 | tee ../evidence/metal/build.log
          test -z "$(git status --porcelain --untracked-files=no)"
          shasum -a 256 target/ci/aurora-viewer > ../evidence/metal/executable.sha256
          rustc --version > ../evidence/metal/toolchain.txt
          cargo --version >> ../evidence/metal/toolchain.txt
      - name: Compile the native PNG inspector
        run: swiftc ../validation/.github/qa/final-metal-pixels.swift -o "$RUNNER_TEMP/final-metal-pixels"
      - name: Capture the three matched scenes on ordinary Metal
        timeout-minutes: 40
        run: |
          caffeinate -dimsu python3 ../validation/.github/qa/final-metal.py \
            target/ci/aurora-viewer "$RUNNER_TEMP/final-metal-pixels" ../evidence/metal
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Collect native Metal messages
        if: always() && !cancelled()
        run: |
          mkdir -p ../evidence/metal
          /usr/bin/log show --last 30m --style compact --predicate 'process == "aurora-viewer"' --info \
            > ../evidence/metal/native-system.log 2>&1 || true
      - name: Upload the Metal render evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendering-final-metal-${{ matrix.side }}-${{ matrix.commit }}
          path: evidence/metal/
          if-no-files-found: error
          retention-days: 14

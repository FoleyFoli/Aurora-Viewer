name: Inventory Explorer Windows preflight
on:
  push:
    branches: [validation/inventory-explorer-3f4225d8]
permissions:
  contents: read
jobs:
  full-check:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out the Explorer icon commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d548fa97c2bacf7f8435560dc41e76023f37cfe3
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity
        shell: python
        run: |
          import subprocess
          for ref, expected in [('HEAD', 'd548fa97c2bacf7f8435560dc41e76023f37cfe3'), ('HEAD^{tree}', 'bc689afa3a604c57a6a29c361eef010f654cf1d6')]:
              actual = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
              print(f'{ref}: {actual}', flush=True)
              if actual != expected:
                  raise SystemExit(f'Expected {expected}; got {actual}')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', 'scripts'], check=True)
      - name: Run the repository check in Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File .\scripts\check.ps1

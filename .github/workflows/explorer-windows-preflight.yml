name: Inventory Explorer Windows preflight
on:
  push:
    branches: [validation/inventory-explorer-3f4225d8]
permissions:
  contents: read
jobs:
  full-check:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out the grid-tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 3f4225d857275df00b28aa1b22fd0e093e4ef14f
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Verify source identity
        shell: python
        run: |
          import subprocess
          for ref, expected in [('HEAD', '3f4225d857275df00b28aa1b22fd0e093e4ef14f'), ('HEAD^{tree}', '0229ed643c4db0f6cb979a2f78cdb81be4cdc1c0')]:
              actual = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
              print(f'{ref}: {actual}', flush=True)
              if actual != expected:
                  raise SystemExit(f'Expected {expected}; got {actual}')
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', 'scripts'], check=True)
      - name: Run the repository check in Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -File .\scripts\check.ps1
